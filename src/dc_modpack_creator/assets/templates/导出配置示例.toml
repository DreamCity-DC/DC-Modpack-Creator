schema_version = 1

[pack]
# 整合包名称
name = "测试整合包"
# 整合包版本
version = "1.0.0"
# 简介
summary = "这是一个测试整合包"
# 是否导出完整包
# true：导出包含PCL启动器的完整ZIP压缩包
# false：导出mrpack格式的整合包
full_package = true

[source]
# 本配置的路径基准目录，默认 "."（程序启动时的工作目录），支持相对或绝对路径
base_dir = "."
# 要导出的MC实例目录
instance_dir = ".minecraft/versions/26.3-Fabric"

[launcher]
# 打包整合包使用的启动器路径
executable = "启动Minecraft.exe"

[output]
# 成品输出目录
directory = "导出"


[files]
# 游戏实例文件导出规则
# 每一行为一条相对于instance_dir的文件/目录路径。路径中可以使用*、?、[a-z]、[xyz]等通配符
# 路径以/开头表示从instance_dir根目录匹配；结尾为/表示目录，否则表示文件。
# !开头表示排除。# 开头为注释行
# 后面的规则覆盖前面的规则
rules = '''

# Mod 文件
/mods/
!/mods/*.disabled
!/mods/*.old
!/mods/.connector/
/coremods/
/lib/

# Mod 设置
/config/
!/config/jei/world/
!/config/worldedit/
/config/worldedit/worldedit.properties
!/config/spark/
/config/spark/config.json
/defaultconfigs/
/journeymap/config/
/journeymap/server/
/TrashSlotSaveState.json
/customfov.txt
/gg.essential.mod/
/essential/
!/essential/*/
!/essential/*.jar*
!/essential/screenshot-checksum-caches.json
!/essential/microsoft_accounts.json
/paragliderSettings.nbt
/local/client_config.json
/local/ftbl.json
/local/client/sidebar_buttons.json
/local/client/ftbutilities.cfg
/local/client/ftblib.cfg
/local/client/xencraft.cfg
/liteloader.properties
/default_reference.xml
/CustomSkinLoader/CustomSkinLoader.json
!/config/tacz/custom

# 排除的文件
!/*.log
!/*.dat_old
!/*.BakaCoreInfo
!/hmclversion.cfg
!/log4j2.xml
'''

# 可选：如果要额外添加一些外部文件进整合包，解除下面的注释

# # 下面extras的source以base_dir为基准计算相对路径
# # destination以zip/mrpack根目录为基准计算相对路径
#
# [[extras]]
# source = "更新日志.txt"
# destination = "更新日志.txt"
# 
# [[extras]]
# source = "使用说明.txt"
# destination = "使用说明.txt"


# 可选：如果想单独调整整合包压缩参数，解除下面的注释

# [compression]
# # 压缩等级，可选0/1/3/5/7/9
# level = 5
# # 分卷压缩大小，可填类似："400MB" / "4GB" / "0"（0表示不分卷压缩）
# volume_size_bytes = "0"
