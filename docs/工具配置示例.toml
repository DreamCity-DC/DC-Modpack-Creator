# 工具配置示例，固定放在：导出/dc-modpack-creator/config.toml。程序尚未实现。
# 应用数据目录为工作目录下的 导出/dc-modpack-creator，日志固定写入其中的 logs/。
# 通常由设置界面维护，也可以退出程序后手工修改；它不会被当作导出任务。
# 工作目录是启动时的当前目录，下面的相对路径都以它为基准。
# 导出任务填写的压缩参数和输出目录优先于这里；未填写才用这里的默认值。

settings_version = 1  # 工具配置格式版本，一般不用改

[compression]
level = 5  # 0/1/3/5/7/9；默认 5，0 为 Store，其余为 Deflate
volume_size_bytes = 0  # 0 关闭分片，只对完整包生效，mrpack包始终单文件
# 启用分片时填写 65_536～4_294_967_295 字节，生成 .z01、.z02、…、.zip。
# volume_size_bytes = 4_000_000_000  # 4 GB（十进制）；1 GiB = 1_073_741_824 字节

[execution]
# 导出任务固定按列表顺序串行执行，当前任务结束并清理后再开始下一项。
compression_threads = 0  # 单任务压缩工作线程上限；0 自动取逻辑处理器数量，正数指定上限
# 仅控制当前 7za 压缩进程，任务串行仍可使用多线程压缩；不保证占满全部核心。
# temporary_directory = "临时导出"  # 省略时使用系统临时目录/DC-Modpack-Creator

[output]
directory = "导出"  # 任务没有填写输出目录时使用
# 整批开始前弹窗确认所有同名文件的替换；各任务开始时删除已确认的旧文件。
# 最终压缩包直接写入输出目录，失败或取消会清理未完成文件，不恢复旧文件。
# 文件复制及完整包内的 modpack.mrpack 仍使用临时目录。
# 修改输出目录不改变应用数据目录；日志正文另存到 logs/，不写进此 TOML。

[state]
selected_configs = []  # 工具自动记忆上次勾选，相对工作目录，例如 ["导出/DC生存服.toml"]

# window 状态表由工具维护，记录窗口位置等，无需手工填写。
