# 导出任务配置示例，保存为：导出/DC生存服.toml。程序尚未实现。
# 工作目录就是程序启动时的当前目录，所有相对源路径、输出路径都以它为基准。
# 也可以使用绝对路径；Windows 路径推荐 /，反斜杠可写在单引号字符串中。
# 本例假设工作目录包含 .minecraft、PCL、启动Minecraft.exe 及下列额外文件。

schema_version = 1  # 配置格式版本，一般不用改

[pack]
name = "【DreamCity】生存服"  # 整合包名称
version = "26.3-1"  # 整合包版本，不是 Minecraft 版本
summary = "DC 生存服客户端整合包"  # 简介，可以省略
full_package = true  # false：mrpack包（单文件 .mrpack）；true：PCL 完整包 ZIP

[source]
minecraft_dir = ".minecraft"  # Minecraft 根目录，用于查找版本和继承信息
instance_dir = ".minecraft/versions/【DreamCity】生存服26.3"  # 开启版本隔离的实例目录，含版本 JSON、mods、config 等
# MC 与加载器版本自动读取；支持原版、Fabric、Forge、NeoForge。

# 这一节只在完整包使用，mrpack包可以整节省略。
[launcher]
executable = "启动Minecraft.exe"  # 本地 PCL 源文件，源名称不限；打包后固定叫“启动Minecraft.exe”
# 默认使用 EXE 同目录下的 PCL 作为启动器个性化来源。

# 可选：不填则使用工具的输出目录，工具也没设置时用“导出”。
[output]
directory = "导出"
# 成品直接输出到此目录；整批开始前确认所有同名旧文件，各任务开始时删除后重新压缩。
# 失败或取消不恢复旧文件；文件复制仍使用临时目录。
# base_name 可以省略，默认“name-version”；不要加扩展名或目录。
base_name = "【DreamCity】生存服26.3-1"

[files]
# 路径相对 instance_dir。默认不选文件，按行处理，后面的规则覆盖前面的。
# ! 开头表示排除；目录尾 / 包含所有后代；支持 *、?、[]，* 可以跨目录。
# 空行和 # 注释忽略；三单引号内的 $、反斜杠保留原样，不执行变量替换。
rules = '''
# Mod：不包含备份、禁用、私用、管理员及可选 Mod
mods/
!mods/*.disabled
!mods/*.old
!mods/*.bak
!mods/*.yq.jar
!mods/*.admin.jar
!mods/*]*.jar
!mods/.connector/
coremods/
lib/

# Mod 设置
config/litematica.json
config/viafabricplus/settings.json
config/maplink/general.json5
config/maplink/hud.json5
config/voxy-config.json
config/voxy-extra.json
config/NotEnoughBandwidthConfig.json
config/defaultoptions/
config/resourcepackoverrides.json
config/xaero/minimap/profiles/default.cfg
config/xaero/minimap/profiles/entity_radar_categories/default.cfg.json
config/xaero/minimap/client.cfg
config/xaerohud.txt
config/takeitout.json

# 内置材质包
!resourcepacks/*.zip
!resourcepacks/*.yq.zip
resourcepacks/*]*.zip

# 内置光影
shaderpacks/*]*.zip
shaderpacks/*]*.zip.txt

# 服务器列表
servers.dat

# Xaero 地图数据
xaero/world-map/Multiplayer_mc.dchome.top/null/mw$-647822281/*.zip
xaero/world-map/Multiplayer_mc.dchome.top/DIM1/mw$-647822281/*.zip
xaero/world-map/Multiplayer_mc.dchome.top/DIM-1/mw$-647822281/*.zip

# 全局排除
!*.log
!*.dat_old
!*.BakaCoreInfo
!command_history.txt
!*IAS_ACCOUNTS*/
'''

# 每条 extras 复制一个文件或整个目录，源必须存在，不再套用上面的选择规则。
# destination 是包内相对路径；省略时使用源名称，不要写绝对路径或 ..。
# 完整包放外层 ZIP 根，mrpack包放 .mrpack 根；同名目标冲突时报错。
# 例如 source="可选Mod/...内容"、destination="附加/可选Mod"，得到“附加/可选Mod/...内容”。
[[extras]]
source = "【更新日志】.txt"
destination = "【更新日志】.txt"

[[extras]]
source = "【使用说明】.txt"
destination = "【使用说明】.txt"

[[extras]]
source = "从旧版DC整合包迁移数据.exe"
destination = "从旧版DC整合包迁移数据.exe"

[[extras]]
source = "可选Mod - 按需拖进启动器安装，不要全装"
destination = "可选Mod - 按需拖进启动器安装，不要全装"


# 可选：只填写想覆盖的压缩项；没填的项使用工具配置。
# 等级只允许 0/1/3/5/7/9；0 为 Store，其余为 Deflate。
# [compression]
# level = 5
# volume_size_bytes = 4_000_000_000  # 4 GB，原生分卷输出 .z01、.z02、…、.zip
# 0 关闭分片
