[project]
name = "dc-modpack-creator"
version = "0.1.0"
description = "DreamCity Windows Minecraft 整合包导出工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pathspec>=1.1.1,<2",
    "PySide6>=6.8,<7",
    "tomli-w>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]
build = ["pyinstaller>=6.17,<7"]

[project.scripts]
dc-modpack-creator = "dc_modpack_creator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
